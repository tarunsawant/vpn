<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <section class="min-h-screen flex justify-center items-center relative">
        <div id="items"
            class=" bg-red-500 absolute left-0 h-[100vh] w-[40%] flex justify-center items-center flex-col gap-5">
            <a class="text-xl" href="">item-1</a>
            <a class="text-xl" href="">item-2</a>
            <a class="text-xl" href="">item-3</a>
            <a class="text-xl" href="">item-4</a>
            <a class="text-xl" href="">item-5</a>
            <button class="text-xl bg-yellow-400 py-3 px-3 rounded-[30px] max-w-[150px] w-full"> helleo
            </button>
        </div>
        <div id="nav" class="bg-white h-[100vh] w-full flex justify-center items-center">
            <button id="button" onclick="abc()"
                class="cursor-pointer bg-white">
                <img height="20" width="20" src="menu.png" alt="menu-img">
            </button>
        </div>
    </section>

    <script>
        function abc() {
            const xyz = document.getElementById('items');
            xyz.classList.toggle('left-0');
            xyz.classList.toggle('left-[-100%]');
        }


    </script>
</body>

</html>
